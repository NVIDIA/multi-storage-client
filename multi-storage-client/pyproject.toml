[build-system]
requires = [
    "maturin>=1.14.1,<2"
]
build-backend = "maturin"

[project]
name = "multi-storage-client"
version = "1.0.1"
description = "Unified high-performance Python client for object and file stores."
authors = [
    { name = "NVIDIA Multi-Storage Client Team" }
]
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.10,<4"
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Programming Language :: Rust"
]
dependencies = [
    "filelock>=3.20.3,<4",
    "jmespath>=1.0.1,<2",
    "jsonschema>=4,<5",
    "python-dateutil>=2.9,<3",
    # PyYAML 6.0.3 and xattr 1.3.0 are the first releases with Python 3.14 wheels, and
    # neither older floor builds from its sdist on 3.14. The bumps are scoped to 3.14 so
    # older interpreters keep their existing floors: raising them there would force an
    # upgrade on downstream pins for no reason, and xattr 1.3.0 ships no PyPy wheels.
    "pyyaml>=6.0.1,<7; python_version<'3.14'",
    "pyyaml>=6.0.3,<7; python_version>='3.14'",
    "opentelemetry-api>=1.24,<2",
    "xattr>=1.1.4,<2; python_version<'3.14'",
    "xattr>=1.3.0,<2; python_version>='3.14'",
    "wcmatch>=10,<11",
    "tqdm>=4.67.1,<5",
    "lark>=1.2.2,<2",
    "prettytable>=3.10,<4",
    "psutil>=7,<8",
    "tzdata>=2024.2,<2026",
]

[project.urls]
source = "https://github.com/NVIDIA/multi-storage-client"
documentation = "https://nvidia.github.io/multi-storage-client/"

[project.optional-dependencies]
# Observability.
observability-otel = [
    "opentelemetry-sdk>=1.32.1,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.32.1,<2",
]
msal = [
    "msal>=1.31.1,<2"
]

vault = [
    "hvac>=2.3,<3",
    "cryptography>=48.0.1"
]

cloudfront = [
    "cryptography>=48.0.1"
]

# MCP.
mcp = [
    "fastmcp>=3.4.2,<4"
]

# Explorer web UI.
explorer = [
    "fastapi>=0.133,<1",
    "uvicorn[standard]>=0.39,<1",
    "aiofiles>=23.2.1",
]

# Storage providers.
aistore = [
    "aistore>=1.23,<2"
]
azure-storage-blob = [
    "azure-storage-blob>=12.28.0,<13",
    "azure-identity>=1.25,<2"
]
boto3 = [
    "boto3>=1.36,<2"
]
google-cloud-storage = [
    "google-cloud-storage>=3.2,<4"
]
huggingface = [
    "huggingface_hub>=0.34.4,<1",
    "hf_transfer>=0.1.9"
]
oci = [
    # 2.182 is the first release pinning crc32c 2.8.0, which has Python 3.14 wheels.
    "oci>=2.181,<3; python_version<'3.14'",
    "oci>=2.182,<3; python_version>='3.14'"
]
parquet = [
    "pyarrow>=23.0.1"
]

# Higher-level libraries.
fsspec = [
    "fsspec>=2023.9.0"
]
hydra-core = [
    "hydra-core>=1.3,<2"
]
numpy = [
    # 2.3.2 is the first release with Python 3.14 wheels.
    "numpy>=2.1,<3; python_version<'3.14'",
    "numpy>=2.3.2,<3; python_version>='3.14'"
]
ray = [
    "ray>=2.56,<3"
]
torch = [
    "torch>=2.13,<3"
]
xarray = [
    "xarray>=2024.07.0"
]
# Zarr 2.x cannot run on Python 3.14: it caps numcodecs <0.16, but numcodecs only
# ships Python 3.14 wheels from 0.16.4 on. Zarr 3.x has Python 3.14 wheels but is a
# breaking API change (no zarr.storage.BaseStore, async store ABC), and its floor of
# Python 3.11 doesn't cover our Python 3.10 support. This extra is therefore empty on
# Python 3.14 until we drop Python 3.10 (EOL October 2026) and migrate to Zarr 3.x.
zarr = [
    "zarr>=2.18.3,<3; python_version=='3.10'",
    "zarr>=2.18.7,<3; python_version>='3.11' and python_version<'3.14'"
]

[dependency-groups]
dev = [
    "types-PyYAML>=6.0.1,<7",
    "types-python-dateutil>=2.9,<3",
    "maturin[zig]>=1.14.1,<2",
    "pytest>=9.1.1,<10",
    "pytest-asyncio>=1.4,<2",
    "pytest-cov>=7.1,<8",
    "pytest-forked>=1.6,<2",
    "pytest-rerunfailures>=16.4,<17",
    "pytest-stress>=1.0.1,<2",
    "pytest-timeout>=2.4,<3",
    "pytest-xdist[psutil]>=3.8,<4",
    "coverage[toml]>=7.15.2,<8"
]

[project.scripts]
msc-benchmark = "multistorageclient.commands.msc_benchmark:main"
msc = "multistorageclient.commands.cli.main:main"

[project.entry-points."fsspec.specs"]
msc = "multistorageclient.contrib.async_fs.MultiStorageAsyncFileSystem"

[tool.coverage.run]
branch = true
concurrency = [
    "multiprocessing",
    "thread"
]
data_file = ".reports/unit/.coverage"
parallel = true
patch = [
    "subprocess"
]
source = [
    "src"
]

[tool.coverage.html]
directory = ".reports/unit/coverage"

[tool.coverage.xml]
output = ".reports/unit/coverage.xml"

[tool.maturin]
manifest-path = "rust/Cargo.toml"
python-packages = [
    "multistorageclient",
    "multistorageclient_rust",
    "hydra_plugins"
]
# Include pre-built static assets for MSC Explorer in the wheel
include = [
    { path = "src/multistorageclient/explorer/static/**/*", format = "wheel" }
]

[tool.pyright]
include = [
    "src",
    "tests"
]
typeCheckingMode = "basic"

[tool.pytest.ini_options]
addopts = [
    "--import-mode=importlib"
]
markers = [
    "serial: marks tests as serial (deselect with '-m \"not serial\"')"
]
pythonpath = [
    "tests"
]
reruns = 3
testpaths = [
    "tests/test_multistorageclient/unit",
    "tests/test_multistorageclient_rust/unit"
]
timeout = 600

[tool.ruff]
extend = "../pyproject.toml"

[tool.ruff.lint]
ignore = [
    "B017",
    "BLE001",
    "TRY002"
]
