[package]
name = "multi-storage-client"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.91.1"
publish = false
description = "Async Rust storage library and benchmark for POSIX and S3"

[lib]
name = "multi_storage_client"
path = "src/lib.rs"

[[bin]]
name = "msc-benchmark"
path = "src/bin/msc-benchmark/main.rs"

[dependencies]
async-trait = "0.1"
aws-config = { version = "=1.8.18", optional = true }
aws-credential-types = { version = "=1.2.14", optional = true }
aws-types = { version = "1.3", optional = true }
aws-smithy-http-client = { version = "=1.1.13", optional = true, default-features = false, features = ["rustls-ring"] }
webpki-root-certs = { version = "=1.0.9", optional = true }
base64 = { version = "0.22", optional = true }
md-5 = { version = "0.10", optional = true }
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
futures = "0.3"
getrandom = "0.4"
globset = "0.4"
http = { version = "1", optional = true }
http-body-util = { version = "0.1", optional = true }
jmespath = { version = "0.5", features = ["sync"] }
uuid = { version = "1", features = ["v4"] }
object_store = { version = "=0.14.2", optional = true, default-features = false }
quick-xml = { version = "0.38", optional = true, features = ["serialize"] }
reqwest = { version = "0.12", optional = true, default-features = false, features = ["rustls-tls-webpki-roots"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
mime_guess = { version = "2", optional = true }
tempfile = "3"
thiserror = "2"
tokio = { version = "1.47", features = ["fs", "io-std", "io-util", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["io", "rt"] }
url = "2"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["fs"] }
xattr = "1"
filetime = "0.2"

[features]
default = ["s3"]
s3 = ["dep:base64", "dep:md-5", "dep:http", "dep:http-body-util", "dep:quick-xml", "dep:reqwest", "dep:object_store", "object_store/aws", "dep:aws-config", "dep:aws-credential-types", "dep:aws-types", "dep:aws-smithy-http-client", "dep:webpki-root-certs", "dep:mime_guess"]

[dev-dependencies]
rcgen = "0.14"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
