#
# GitHub Actions workflow configuration.
#
# https://docs.github.com/en/actions/writing-workflows/workflow-syntax-for-github-actions
#

name: Manual Benchmark
on:
  workflow_dispatch:
jobs:
  check-benchmarks:
    name: Check Benchmarks
    permissions:
      contents: read
    strategy:
      matrix:
        python-binary:
          - python3.11
          - python3.12
          - python3.13
          - python3.14
      fail-fast: false
    runs-on: linux-amd64-cpu16
    defaults:
      run:
        shell: nix develop ${{ github.workspace }}#"\"${{ matrix.python-binary }}\"" --command bash -e {0}
    steps:
      # Checkout.
      - uses: actions/checkout@v6.1.0
      # Install Nix.
      - uses: DeterminateSystems/determinate-nix-action@v3.24.2
        with:
          summarize: false
      # Main.
      - working-directory: multi-storage-client
        run: |
          just python-binary=${{ matrix.python-binary }} run-benchmarks
      - uses: actions/upload-artifact@v7.0.2
        with:
          if-no-files-found: error
          name: ${{ github.job }} (${{ matrix.python-binary }})
          path: |
            -
            multi-storage-client/.reports/benchmark/
