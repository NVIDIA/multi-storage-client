#
# GitLab CI configuration.
#
# https://docs.gitlab.com/ee/ci/yaml
#

stages:
  - 💽

default:
  interruptible: false

#
# Jobs.
#

# Properties we can't set with `default`.
.default:
  stage: 💽

.child:
  extends:
    - .default
  trigger:
    forward:
      pipeline_variables: false
      yaml_variables: false
    # TODO: Switch to `mirror` once on GitLab 18.2.
    strategy: depend

Source:
  extends:
    - .child
  inherit:
    variables: false
  variables:
    MSC_SOURCE_COMPARE_TO: $CI_COMMIT_BEFORE_SHA
  trigger:
    forward:
      yaml_variables: true
    include: .gitlab/pipelines/.source.yml

Beta:
  extends:
    - .child
  needs:
    - Source
  rules:
    - changes:
        - flake.lock
        - flake.nix
        - nix/**/*
        - pyproject.toml
        - uv.lock
        - multi-storage-client/**/*
        - multi-storage-explorer/**/*
        - .gitlab/pipelines/.beta.yml
    - when: manual
      allow_failure: true
  environment:
    name: Beta
    action: start
  trigger:
    include: .gitlab/pipelines/.beta.yml
